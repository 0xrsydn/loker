<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loker golden set</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3de;
    --accent: #2f5fd0; --right: #1f8a4c; --right-bg: #e6f4ec; --wrong: #c0392b; --wrong-bg: #fbeae8;
    --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1e1e1c; --ink: #ecebe6; --muted: #9a9993; --line: #33322f;
      --accent: #7ea2ff; --right: #5fd391; --right-bg: #1c3226; --wrong: #ff8a7d; --wrong-bg: #3a2220;
      --mark: #5a4d12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .saved { margin-left: auto; color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px;
               padding: 2px 8px; font: inherit; font-size: 13px; cursor: pointer; }
  nav button.done { background: var(--right-bg); border-color: var(--right); }
  nav button.current { outline: 2px solid var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .kind { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; color: var(--muted); }
  h2 { margin: 4px 0 2px; font-size: 19px; }
  .meta { color: var(--muted); margin-bottom: 12px; }
  .question { font-weight: 600; margin: 16px 0 8px; }
  .money { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 0 0 10px; }
  .money p { margin: 4px 0; }
  mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
  details { margin: 8px 0; }
  summary { cursor: pointer; color: var(--accent); }
  .desc { white-space: pre-wrap; max-height: 420px; overflow: auto; border: 1px solid var(--line);
          border-radius: 8px; padding: 10px; font-size: 14px; margin-top: 8px; }
  .opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px;
         padding: 10px; margin: 8px 0; }
  .opt.right { background: var(--right-bg); border-color: var(--right); }
  .opt.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .opt .key { font-weight: 700; width: 1.5em; }
  .opt .text { flex: 1; overflow-wrap: anywhere; }
  .opt button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px;
                padding: 4px 10px; font: inherit; cursor: pointer; }
  .opt button.on.r { background: var(--right); color: #fff; border-color: var(--right); }
  .opt button.on.w { background: var(--wrong); color: #fff; border-color: var(--wrong); }
  label.field { display: block; margin-top: 12px; color: var(--muted); font-size: 13px; }
  input[type=text], textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
         border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-top: 4px; }
  textarea { min-height: 52px; }
  .rules { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .rules li { margin: 2px 0; }
  .pager { display: flex; justify-content: space-between; margin-top: 16px; }
  .pager button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
                  background: var(--card); color: var(--ink); cursor: pointer; }
  @media (max-width: 600px) { .opt { flex-wrap: wrap; } .opt .text { flex-basis: 100%; } }
</style>
</head>
<body>
<header>
  <h1>loker golden set</h1>
  <span class="progress" id="progress"></span>
  <nav id="nav"></nav>
  <span class="saved" id="saved"></span>
</header>
<main>
  <div class="card" id="card">Loading…</div>
  <div class="pager">
    <button id="prev">← Previous</button>
    <button id="next">Next →</button>
  </div>
</main>
<script>
const RULES = {
  pay: [
    "Base pay is the salary, wage or contract rate for this job, in its currency and per its period.",
    "Not pay: funding, revenue, sales targets, budgets, benefits and stipends (wellness, meals, learning), totals.",
    "\"Competitive\" or \"DOE\" is no pay. A range with no period you can tell is left out.",
    "Extras: equity, bonus, commission, OTE, sign-on that the posting offers this hire.",
    "Mark every answer right or wrong. An answer is right only if all of it is right.",
  ],
  role: [
    "The role is what the person in this job does day to day, in loker's vocabulary.",
    "The most specific role that fits; a family only when the posting gives no more.",
    "Judge from what the labelers saw: title, source category and the start of the description.",
    "Mark every answer right or wrong. A close but different role is wrong; say which you'd pick.",
  ],
};
let data, verdicts = {}, i = 0, timer;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MONEY = /([$€£₹₱]|\b(?:USD|EUR|GBP|CAD|AUD|NZD|SGD|INR|IDR|PHP|MYR|CHF|JPY|ZAR|CZK|HUF|PLN|BRL|MXN)\b)\s?\d[\d,. ]*(?:[kKM]\b)?|\d[\d,. ]*\s?(?:[kK])?\s?(?:USD|EUR|GBP|CAD|AUD|PHP|MYR|CZK|HUF|ZAR|INR|IDR)\b|\d[\d,.]*\s?(?:k|K)?€/g;
const highlight = (s) => esc(s).replace(MONEY, (m) => `<mark>${m}</mark>`);

function v(id) { return verdicts[id] ??= { marks: {}, correct: "", note: "" }; }
function isDone(it) { const x = verdicts[it.id]; return x && it.options.every((o) => x.marks[o.key]); }

function save() {
  $("saved").textContent = "saving…";
  clearTimeout(timer);
  timer = setTimeout(async () => {
    for (const it of data.items) if (verdicts[it.id]) verdicts[it.id].done = isDone(it);
    const r = await fetch("/save", { method: "POST", body: JSON.stringify(verdicts) });
    $("saved").textContent = r.ok ? "saved " + new Date().toLocaleTimeString() : "save failed";
  }, 300);
}

function render() {
  const it = data.items[i];
  const x = v(it.id);
  const n = data.items.filter(isDone).length;
  $("progress").textContent = `${n} of ${data.items.length} reviewed`;
  $("nav").innerHTML = data.items.map((t, k) =>
    `<button class="${isDone(t) ? "done" : ""} ${k === i ? "current" : ""}" data-k="${k}">${t.kind === "pay" ? "P" : "R"}${k + 1}</button>`).join("");
  let body = "";
  if (it.kind === "pay") {
    const lines = it.description.split(/\n+/).filter((l) => { MONEY.lastIndex = 0; return MONEY.test(l); });
    body = `<div class="question">Lines with money (${lines.length})</div>` +
      (lines.length ? `<div class="money">${lines.map((l) => `<p>${highlight(l)}</p>`).join("")}</div>` : `<p class="meta">None: the posting has no currency figures.</p>`) +
      `<details><summary>Full description</summary><div class="desc">${highlight(it.description)}</div></details>` +
      `<div class="question">What pay does this posting state?</div>`;
  } else {
    body = `<p class="meta">Source category: ${esc(it.category || "(none)")}</p>` +
      `<div class="desc">${esc(it.description)}…</div>` +
      `<div class="question">What role is this job?</div>`;
  }
  body += it.options.map((o) => {
    const m = x.marks[o.key];
    return `<div class="opt ${m || ""}"><span class="key">${o.key}</span><span class="text">${esc(o.text)}</span>
      <button class="r ${m === "right" ? "on" : ""}" data-key="${o.key}" data-mark="right">Right</button>
      <button class="w ${m === "wrong" ? "on" : ""}" data-key="${o.key}" data-mark="wrong">Wrong</button></div>`;
  }).join("");
  const correct = it.kind === "role"
    ? `<select id="correct"><option value="">(only if no answer is right)</option>${["none", ...data.vocabulary].map((r) => `<option ${x.correct === r ? "selected" : ""}>${r}</option>`).join("")}</select>`
    : `<input type="text" id="correct" value="${esc(x.correct)}" placeholder="e.g. USD 120,000–150,000 a year + equity">`;
  body += `<label class="field">The right answer, if none above is${correct}</label>
    <label class="field">Note (optional)<textarea id="note">${esc(x.note)}</textarea></label>`;
  $("card").innerHTML = `<div class="kind">${it.kind} · ${i + 1} of ${data.items.length} · ${it.id}</div>
    <h2>${esc(it.title)}</h2><div class="meta">${esc(it.company)}</div>
    <ul class="rules">${RULES[it.kind].map((r) => `<li>${esc(r)}</li>`).join("")}</ul>${body}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.k) { i = +b.dataset.k; render(); return; }
  if (b.dataset.mark) {
    const x = v(data.items[i].id);
    x.marks[b.dataset.key] = x.marks[b.dataset.key] === b.dataset.mark ? undefined : b.dataset.mark;
    render(); save();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "correct" || e.target.id === "note") { v(data.items[i].id)[e.target.id] = e.target.value; save(); }
});
document.addEventListener("change", (e) => { if (e.target.id === "correct") { v(data.items[i].id).correct = e.target.value; save(); } });
$("prev").onclick = () => { i = Math.max(0, i - 1); render(); scrollTo(0, 0); };
$("next").onclick = () => { i = Math.min(data.items.length - 1, i + 1); render(); scrollTo(0, 0); };

fetch("/data").then((r) => r.json()).then((d) => { data = d; verdicts = d.verdicts || {}; render(); });
</script>
</body>
</html>
