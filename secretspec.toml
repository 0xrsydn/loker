# Secrets loker can use. None is required: without them loker runs fully
# offline. Values never go in config.toml or this file; loker reads them from
# the environment, so run it through secretspec (or any secrets manager):
#
#   secretspec run -- loker ingest --all
#   secretspec run --file /path/to/loker/secretspec.toml -- loker roles enrich
[project]
name = "loker"
revision = "1.0"

[profiles.default]
OPENROUTER_API_KEY = { description = "Jev role classification through OpenRouter, when [providers.jev] is in config.toml", required = false }
