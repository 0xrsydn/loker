name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = false
            extra-substituters = https://cache.rasyidanaf.com/loker-nix-cache
            extra-trusted-public-keys = loker-ci-1:uzoeDmTAwNEvZTMuCmd28RZngImk4Oj5L9zS0WvohX4=
            fallback = true
      - run: nix flake check -L --show-trace
      - name: Push build dependencies to the R2 cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: .github/push-nix-cache.sh
