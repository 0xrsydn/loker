# Every push and pull request: `nix flake check` builds the release binary,
# runs all tests (offline: store rules, search, lifecycle, e2e against a local
# stub, contract schema drift), runs clippy with warnings denied and checks
# formatting with rustfmt.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = false
      - run: nix flake check -L --show-trace
